# Serves the rendered MkDocs user guide inside the image (replaces nginx:alpine's
# default.conf). PREFIXED (docs.nginx.conf, not nginx.conf) — this repo's app doesn't ship
# its own root nginx.conf, but the prefix stays consistent with docs.Dockerfile's naming
# and every other repo's docs scaffolding.
#
# ⚠ THE SITE LIVES UNDER /hub/ INSIDE THE CONTAINER, MATCHING ITS PUBLIC PATH. Ayula
# proxies the path through UNCHANGED (`proxy_pass http://host:8109;` — no trailing slash, no
# strip). That is not a stylistic choice:
#
#   MkDocs links pages as directory URLs (/hub/chores/, no .html), so nginx 301s /chores to
#   add the slash. With `absolute_redirect off` that Location is ROOT-relative — relative to
#   the ORIGIN, not to the proxied prefix. If Ayula stripped /hub/, the browser would
#   resolve that redirect to docs.twobots.dev/chores/ and land on another repo's docs or a
#   404. Serving at the real path makes the redirect emit /hub/chores/, which is correct at
#   both hostnames.
#
# It also keeps the sitemap, the canonical link, and any hand-written absolute link
# agreeing with reality instead of being off by a prefix.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # See the header note: this MUST stay off, and its correctness now depends on the site
    # being rooted at /hub/ rather than on Ayula rewriting anything.
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # A docs site is almost entirely text. The search index in particular is a large JSON
    # file downloaded by everyone who opens the search box.
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    # NB: woff2 is already compressed — deliberately absent.

    # A bare hit on the container (LAN, or the deploy smoke test) lands somewhere useful
    # rather than on a 404 that looks like a broken deploy.
    location = / { return 301 /hub/; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # mkdocs-material content-hashes these filenames, so a new build is a new URL and a long
    # cache can never serve a stale bundle.
    #
    # NB `expires 30d` is deliberately NOT used alongside this: it emits its own
    # Cache-Control, so the two together send the header TWICE and clients honouring the
    # first silently lose `immutable`.
    location /hub/assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # NOT content-hashed — mkdocs rewrites this in place on every build, so it must
    # revalidate or search silently returns the previous release's pages.
    location = /hub/search/search_index.json {
        add_header Cache-Control "no-cache";
    }

    location = /hub/sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
}
